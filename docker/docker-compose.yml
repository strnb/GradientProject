version: '3.9'

services:

  postgres:
    image: postgres:17

    container_name: gradient_postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: gradient_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: always

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    container_name: gradient_server

    depends_on:
      - postgres

    ports:
      - "5000:5000"

    stdin_open: true
    tty: true

    restart: always

volumes:
  postgres_data: