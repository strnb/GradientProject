version: '3.9'

services:

  postgres:
    image: cr.yandex/mirror/postgres:17

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: gradient_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  server:
    build:
      context: ..

      dockerfile: docker/Dockerfile

    depends_on:
      - postgres

    ports:
      - "5000:5000"

volumes:
  postgres_data: